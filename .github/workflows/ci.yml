name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build, test and static analysis
        run: mvn -B -ntp clean verify
      - name: Upload HPI
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-hierarchical-jobs-hpi
          path: target/jenkins-hierarchical-jobs.hpi
          if-no-files-found: error
