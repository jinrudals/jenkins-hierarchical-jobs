name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify tag matches pom version
        run: |
          pom_version=$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          [ "v${pom_version}" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != pom ${pom_version}"; exit 1; }
      - run: mvn -B clean verify
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" target/jenkins-hierarchical-jobs.hpi --generate-notes --title "${GITHUB_REF_NAME}"
